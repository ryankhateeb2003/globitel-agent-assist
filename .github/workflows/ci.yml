name: CI

# Step 1: WHEN this workflow runs.
#   - push to main: catches anything that lands on main directly (e.g.
#     right after a merge), confirming main is still healthy.
#   - pull_request into main: runs the pipeline on the PROPOSED merge
#     before it's allowed in -- this is the real safety gate, catching
#     broken code before it reaches main, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Step 2: WHAT the workflow actually runs -- two jobs, the second
# depending on the first (needs: lint) so we don't spend minutes
# installing heavy ML dependencies (torch, sentence-transformers) just
# to run tests against code that doesn't even parse.
jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check all Python files compile
        run: python -m compileall -q app

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run language detection tests
        run: |
          python -m app.rag.test_language_detection | tee lang_output.txt
          if grep -q "MISMATCH" lang_output.txt; then
            echo "One or more language-detection cases failed."
            exit 1
          fi

      - name: Run guardrail tests (pure, no network)
        run: |
          python -m app.guardrails.test_guardrails | tee guardrail_output.txt
          if grep -q "MISMATCH" guardrail_output.txt; then
            echo "One or more guardrail cases failed."
            exit 1
          fi
