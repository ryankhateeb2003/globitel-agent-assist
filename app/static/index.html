<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globitel Agent Assist</title>
<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e2e6ec;
    --text: #1c2430;
    --muted: #6b7686;
    --accent: #ff7900; /* Orange brand */
    --accent-dark: #d96700;
    --user-bubble: #eef1f6;
    --bot-bubble: #fff8f2;
    --green: #1e9e5a;
    --green-bg: #e7f7ee;
    --yellow: #a8790a;
    --yellow-bg: #fff6df;
    --red: #c0362c;
    --red-bg: #fdeceb;
    --orange: #c0592c;
    --orange-bg: #fdf0e8;
    --gray: #5a6472;
    --gray-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --panel: #1c222c;
      --border: #2b323e;
      --text: #e7ecf3;
      --muted: #8b96a8;
      --user-bubble: #262e3a;
      --bot-bubble: #241d17;
      --green-bg: #123522;
      --yellow-bg: #3a2e0e;
      --red-bg: #3a1614;
      --orange-bg: #3a2314;
      --gray-bg: #262b33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button.ctrl {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  button.ctrl:hover { border-color: var(--accent); }

  .recent-panel {
    max-width: 900px;
    width: 100%;
    margin: 12px auto 0;
    padding: 0 20px;
    font-size: 13px;
  }
  .recent-panel summary {
    cursor: pointer;
    color: var(--muted);
    padding: 8px 0;
  }
  .recent-list { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
  .recent-item {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .recent-item:hover { border-color: var(--accent); }
  .recent-item .q { font-weight: 600; font-size: 13px; }
  .recent-item .a { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .recent-empty { color: var(--muted); font-size: 12.5px; padding: 4px 0 8px; }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .turn { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { background: var(--user-bubble); border: 1px solid var(--border); }
  .bubble.bot { background: var(--bot-bubble); border: 1px solid var(--border); }
  .meta-line { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .badge.answer_normally { color: var(--green); background: var(--green-bg); }
  .badge.ambiguous { color: var(--yellow); background: var(--yellow-bg); }
  .badge.no_info { color: var(--gray); background: var(--gray-bg); }
  .badge.out_of_domain { color: var(--red); background: var(--red-bg); }
  .badge.needs_account_data { color: var(--orange); background: var(--orange-bg); }
  .badge.error { color: var(--red); background: var(--red-bg); }

  .footer-info {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  .footer-info span { display: inline-flex; align-items: center; gap: 3px; }

  details.sources {
    margin-top: 6px;
    font-size: 12px;
  }
  details.sources summary {
    cursor: pointer;
    color: var(--accent-dark);
  }
  details.sources ul { margin: 6px 0 0; padding-inline-start: 18px; color: var(--muted); }
  .chunk-list { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .chunk-card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
  .chunk-card-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .chunk-score { color: var(--accent-dark); font-weight: 600; }
  .chunk-text { font-size: 12.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }

  #inputBar {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    min-height: 42px;
    max-height: 120px;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:hover { background: var(--accent-dark); }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .cursor-blink::after {
    content: "▍";
    animation: blink 1s step-start infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <div>
    <h1><span class="dot"></span> Globitel Agent Assist</h1>
    <div class="sub">Task 6 -- guardrails-aware bilingual RAG demo</div>
  </div>
  <div class="controls">
    <select id="modeSelect" title="Retrieval mode">
      <option value="hybrid" selected>Hybrid</option>
      <option value="vector">Vector</option>
      <option value="keyword">Keyword</option>
    </select>
    <select id="langSelect" title="Language override">
      <option value="" selected>Auto-detect</option>
      <option value="ar">Arabic</option>
      <option value="en">English</option>
    </select>
    <button class="ctrl" id="clearBtn">Clear history</button>
  </div>
</header>

<details id="recentPanel" class="recent-panel">
  <summary>🕘 آخر 5 أسئلة</summary>
  <div id="recentList" class="recent-list"></div>
</details>

<div id="transcript">
  <div class="empty-hint" id="emptyHint">اسأل أي سؤال عن خدمات Orange Jordan (خطوط، إنترنت، محفظة، تجوال، فواتير)...</div>
</div>

<div id="inputBar">
  <textarea id="questionInput" placeholder="اكتب سؤالك هنا... (Enter للإرسال، Shift+Enter لسطر جديد)" rows="1"></textarea>
  <button id="sendBtn">إرسال</button>
</div>

<script>
const transcript = document.getElementById('transcript');
const emptyHint = document.getElementById('emptyHint');
const input = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const modeSelect = document.getElementById('modeSelect');
const langSelect = document.getElementById('langSelect');
const clearBtn = document.getElementById('clearBtn');

const HISTORY_KEY = 'globitel_agent_assist_history_v1';
const MARKER = '\n\n---METADATA---\n';

const BADGE_LABELS = {
  answer_normally: 'جواب مباشر',
  ambiguous: 'سؤال يحتاج توضيح',
  no_info: 'لا تتوفر معلومة',
  out_of_domain: 'خارج النطاق',
  needs_account_data: 'يحتاج بيانات حساب',
  error: 'خطأ'
};

function looksArabic(text) {
  return /[؀-ۿ]/.test(text);
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveHistoryEntry(entry) {
  try {
    const history = loadHistory();
    history.push(entry);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) { /* storage unavailable -- ignore, page still works */ }
  renderRecentPanel();
}

function clearHistory() {
  try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
  transcript.innerHTML = '';
  transcript.appendChild(emptyHint);
  emptyHint.style.display = '';
  renderRecentPanel();
}

function truncate(s, n) {
  s = s || '';
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// Compact "last 5 questions" quick-reference list, separate from the full
// scrolling transcript below it -- clicking an entry jumps to that turn.
function renderRecentPanel() {
  const recentList = document.getElementById('recentList');
  const history = loadHistory();
  const last5 = history.slice(-5).reverse();

  if (!last5.length) {
    recentList.innerHTML = '<div class="recent-empty">لسا ما في أسئلة.</div>';
    return;
  }

  recentList.innerHTML = '';
  for (const item of last5) {
    const row = document.createElement('div');
    row.className = 'recent-item';
    const q = document.createElement('div');
    q.className = 'q';
    q.dir = looksArabic(item.question) ? 'rtl' : 'ltr';
    q.textContent = truncate(item.question, 70);
    const a = document.createElement('div');
    a.className = 'a';
    a.dir = looksArabic(item.answer || '') ? 'rtl' : 'ltr';
    a.textContent = truncate(item.answer, 90);
    row.appendChild(q);
    row.appendChild(a);
    row.addEventListener('click', () => {
      const el = document.querySelector(`.turn[data-ts="${item.timestamp}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    recentList.appendChild(row);
  }
}

function renderTurn(question, questionMode, questionLang, ts) {
  emptyHint.style.display = 'none';

  const turn = document.createElement('div');
  turn.className = 'turn';
  if (ts) turn.dataset.ts = ts;

  const userRow = document.createElement('div');
  userRow.className = 'row user';
  const userBubble = document.createElement('div');
  userBubble.className = 'bubble user';
  userBubble.dir = looksArabic(question) ? 'rtl' : 'ltr';
  userBubble.textContent = question;
  userRow.appendChild(userBubble);
  turn.appendChild(userRow);

  const botRow = document.createElement('div');
  botRow.className = 'row bot';
  const botCol = document.createElement('div');
  botCol.style.maxWidth = '78%';

  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.style.display = 'none';
  botCol.appendChild(badge);

  const botBubble = document.createElement('div');
  botBubble.className = 'bubble bot cursor-blink';
  botBubble.dir = looksArabic(question) ? 'rtl' : 'ltr';
  botCol.appendChild(botBubble);

  const footer = document.createElement('div');
  footer.className = 'footer-info';
  botCol.appendChild(footer);

  const sourcesEl = document.createElement('details');
  sourcesEl.className = 'sources';
  sourcesEl.style.display = 'none';
  botCol.appendChild(sourcesEl);

  botRow.appendChild(botCol);
  turn.appendChild(botRow);

  transcript.appendChild(turn);
  transcript.scrollTop = transcript.scrollHeight;

  return { badge, botBubble, footer, sourcesEl };
}

function renderMetadata(refs, meta, answerText) {
  refs.botBubble.classList.remove('cursor-blink');
  refs.botBubble.dir = meta.language === 'ar' ? 'rtl' : 'ltr';

  const action = meta.guardrail_action || 'answer_normally';
  refs.badge.textContent = BADGE_LABELS[action] || action;
  refs.badge.className = 'badge ' + action;
  refs.badge.style.display = 'inline-block';

  const pieces = [];
  if (meta.language) pieces.push(`<span>🌐 ${meta.language.toUpperCase()}</span>`);
  if (meta.retrieval_mode) pieces.push(`<span>🔎 ${meta.retrieval_mode}</span>`);
  if (typeof meta.retrieval_latency_ms === 'number') pieces.push(`<span>📡 استرجاع: ${(meta.retrieval_latency_ms / 1000).toFixed(1)} ث</span>`);
  if (typeof meta.total_elapsed_s === 'number') pieces.push(`<span>⏱ الوقت الكلي: ${meta.total_elapsed_s.toFixed(1)} ث</span>`);
  const topChunk = (meta.retrieved_chunks || [])[0];
  const topScore = topChunk ? (topChunk.rerank_score ?? topChunk.score) : null;
  if (typeof topScore === 'number') pieces.push(`<span>🎯 ${(topScore * 100).toFixed(0)}%</span>`);
  if (meta.token_usage && meta.token_usage.total_tokens) pieces.push(`<span>🧮 ${meta.token_usage.total_tokens} tok</span>`);
  refs.footer.innerHTML = pieces.join('');

  const chunks = meta.retrieved_chunks || [];
  if (chunks.length) {
    refs.sourcesEl.style.display = '';
    refs.sourcesEl.innerHTML = `<summary>عملية البحث -- ${chunks.length} نتيجة مسترجعة</summary>` +
      '<div class="chunk-list">' + chunks.map(renderChunkCard).join('') + '</div>';
  } else if (meta.sources && meta.sources.length) {
    // Fallback for guardrail short-circuit responses, which don't attach
    // full retrieved_chunks -- just the source file names.
    refs.sourcesEl.style.display = '';
    refs.sourcesEl.innerHTML = `<summary>المصادر (${meta.sources.length})</summary>` +
      '<ul>' + meta.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('') + '</ul>';
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderChunkCard(chunk, i) {
  const score = chunk.rerank_score ?? chunk.score ?? null;
  const scoreLabel = typeof score === 'number' ? `${(score * 100).toFixed(1)}%` : '--';
  const preview = (chunk.text || '').slice(0, 300);
  const truncated = (chunk.text || '').length > 300 ? '...' : '';
  return `
    <div class="chunk-card">
      <div class="chunk-card-head">
        <span>#${i + 1} -- ${escapeHtml(chunk.source_file || '')}</span>
        <span class="chunk-score">🎯 ${scoreLabel}</span>
      </div>
      <div class="chunk-text" dir="${looksArabic(chunk.text || '') ? 'rtl' : 'ltr'}">${escapeHtml(preview)}${truncated}</div>
    </div>`;
}

function renderError(refs, message) {
  refs.botBubble.classList.remove('cursor-blink');
  refs.badge.textContent = BADGE_LABELS.error;
  refs.badge.className = 'badge error';
  refs.badge.style.display = 'inline-block';
  refs.botBubble.textContent = message;
}

async function sendQuestion() {
  const question = input.value.trim();
  if (!question) return;

  const mode = modeSelect.value;
  const language = langSelect.value || null;

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const ts = new Date().toISOString();
  const refs = renderTurn(question, mode, language, ts);

  const startTime = performance.now();
  let buffer = '';
  let response;
  try {
    response = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, mode, language, top_k: 5 })
    });
  } catch (e) {
    renderError(refs, 'تعذر الاتصال بالسيرفر. تأكد إنه شغّال.');
    sendBtn.disabled = false;
    return;
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let markerIdx = -1;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    if (markerIdx === -1) {
      markerIdx = buffer.indexOf(MARKER);
      refs.botBubble.textContent = markerIdx === -1 ? buffer : buffer.slice(0, markerIdx);
      transcript.scrollTop = transcript.scrollHeight;
    }
  }

  if (!response.ok) {
    let msg = 'حدث خطأ.';
    try { msg = JSON.parse(buffer).error || msg; } catch (e) {}
    renderError(refs, msg);
    sendBtn.disabled = false;
    return;
  }

  markerIdx = buffer.indexOf(MARKER);
  if (markerIdx === -1) {
    // No metadata marker -- likely a validation error response.
    let msg = buffer;
    try { msg = JSON.parse(buffer).error || msg; } catch (e) {}
    renderError(refs, msg);
    sendBtn.disabled = false;
    return;
  }

  const answerText = buffer.slice(0, markerIdx);
  let meta = {};
  try { meta = JSON.parse(buffer.slice(markerIdx + MARKER.length)); } catch (e) {}

  // total_elapsed_s is measured client-side (request sent -> stream fully
  // received), not something the backend returns -- retrieval_latency_ms
  // only covers the retrieval step, not guardrail classification or
  // answer generation, so this is the only true end-to-end number.
  meta.total_elapsed_s = (performance.now() - startTime) / 1000;

  refs.botBubble.textContent = answerText;
  renderMetadata(refs, meta, answerText);

  saveHistoryEntry({
    timestamp: ts,
    question, mode, language,
    answer: answerText,
    meta
  });

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', sendQuestion);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuestion();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
clearBtn.addEventListener('click', clearHistory);

// Replay saved history on load.
(function restoreHistory() {
  const history = loadHistory();
  for (const item of history) {
    const refs = renderTurn(item.question, item.mode, item.language, item.timestamp);
    refs.botBubble.textContent = item.answer;
    renderMetadata(refs, item.meta || {}, item.answer);
  }
  renderRecentPanel();
})();
</script>

</body>
</html>
